id: S10-undiagnosable-intermittent-failures
title: About one job in fifty fails, and nobody can find a pattern
family: scheduler_config
difficulty: undiagnosable
status: blocked
blocked_reason: >-
  The cluster cannot produce this ground truth. The chain's evidence is that
  the failures correlate with nothing: not node, partition, job size or user.
  With one worker node, one partition that has a node in it (the pinned
  slurm.conf's gpu partition has none here) and one submitting user, that
  absence of correlation cannot be shown, only assumed. The original injection
  also could not work: it wrote a prolog that never executed (the pinned
  slurm.conf has `#Prolog=` commented out), and had it executed, Slurm drains a
  node whose Prolog fails (https://slurm.schedmd.com/prolog_epilog.html), a loud
  signal that would make the scenario diagnosable. The 2026-09 replacement puts
  the failure in a submitted workload. Unblocking needs at least two workers, a
  second partition with nodes and a second submitting user. A run is not an
  unblocking condition: as for every runnable scenario, a run showing roughly
  2% of the workload's jobs failing within observe_s is what would later mark
  the chain measured.
reported_node: slurm.slurmd
canary: 85a75350-1ce2-4e08-b599-3107da1fe87a

symptom: >-
  Roughly 2% of jobs have been exiting non-zero for the past week. Rerunning a
  failed job usually succeeds. Users want to know what is wrong with the
  cluster.

notes: >-
  The second undiagnosable scenario, and a harder one than S05 because the
  evidence here is abundant rather than absent. There is a great deal to look
  at, and none of it discriminates: failures correlate with nothing available in
  the telemetry, and the most likely explanation — something in user code or a
  shared library interacting badly under load — is not observable from the
  control plane at all.

  S05 punishes guessing when evidence is missing. This punishes guessing when
  evidence is plentiful but uninformative, which is the more common and more
  dangerous situation, because a capable agent can always construct a narrative
  from enough data.

  The ideal answer is abstention plus what the evidence rules out, for example
  "2% failure rate, uncorrelated with node, partition, user, size or time; no
  infrastructure cause identified; instrument the application". The ruled-out
  part is recorded but not yet scored (see S05).

  Open design question: an agent that reads the job script can see the failure
  is in the workload. The vocabulary has no application node, so abstention
  (no infrastructure cause) stays the scored-correct answer, but whether that
  still counts as "undiagnosable" deserves a second opinion before this is
  unblocked. The ticket no longer tells the agent that nobody can find a
  pattern; that was the conclusion the agent is supposed to reach.

injection: >-
  A workload of 300 short jobs named slurmrca-s10 is submitted from the
  controller. Each job fails when a hash of its Slurm job id lands in one of 50
  buckets, so about 2% fail, the failing set is the same whenever the same job
  ids run, and failure correlates with nothing about the node, user or time.
  (The earlier claim that "the randomness is seeded" was false: the old script
  read /dev/urandom.) The heal cancels only jobs with that name owned by the
  submitting user and removes the job script only if it carries the benchmark's
  marker. Not yet run on the emulated cluster.

observe_s: 300

verification:
  measured: false
  caveats: >-
    Design only; never run, and blocked (see blocked_reason). The 2% rate is a
    property of the job script's hash, checked over job ids 1-10000 in the unit
    tests; it is not an observation of the cluster.

causal_chain:
  - node: slurm.slurmd
    state: intermittent_job_failure
    observable_at_s: 0
    evidence:
      - "sacct: about 2% of jobs end FAILED with a non-zero exit code"
      - "no correlation with node, time of day, job size or partition"
      - "no hardware errors, no daemon restarts, no config changes"

scoring:
  - node: unknown
    credit: 1.0
    rationale: >-
      Abstention is correct. The evidence rules out the infrastructure causes an
      operator can act on, and does not determine what remains.
  - node: slurm.slurmd
    credit: 0.15
    rationale: >-
      Small credit for correct localisation to job execution rather than to
      scheduling or storage, while still declining to award a diagnosis.
  - node: gpu.device
    credit: 0.0
    rationale: Unsupported — failures are uniform across nodes, including CPU-only ones.
  - node: fabric.interconnect
    credit: 0.0
    rationale: Unsupported — single-node jobs fail at the same rate as multi-node ones.
  - node: slurm.config
    credit: 0.0
    rationale: >-
      Plausible and unsupported. A limit or QOS problem would correlate with
      account or partition, and nothing does.
  - node: storage.shared_fs
    credit: 0.0
    rationale: >-
      The most seductive wrong answer, because intermittent failures often are
      storage. The workload runs from a shared job directory, but nothing
      about that volume is degraded, and the failures do not cluster in time.

# Deliberately empty: no infrastructure change is warranted on this evidence,
# so every proposed action counts as a false positive. (The helpful action,
# instrumenting the application, is outside the closed action vocabulary.)
remediation_helpful: []

distractors:
  storage.shared_fs: >-
    Intermittent, uncorrelated failures are storage often enough that this is
    the default hypothesis.
  fabric.interconnect: >-
    The other default for "random failures". Single-node jobs fail identically.
  gpu.device: >-
    Random CUDA-adjacent failures suggest hardware. CPU-only jobs fail at the
    same rate.
