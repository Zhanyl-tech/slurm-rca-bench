id: S07-fabric-degraded-collectives
title: Multi-node jobs crawl, single-node jobs are fine
family: fabric
difficulty: single_layer
status: blocked
blocked_reason: >-
  The injection cannot produce this ground truth on the current cluster. netem
  is applied to the worker's only interface, which carries slurmd-slurmctld
  control traffic, so a faithful reading of the evidence points at
  network.control_plane (0.35), not fabric.interconnect (1.0). The compose file
  runs one worker, so multi-node jobs and the single-node/multi-node split in
  the ticket cannot exist, and nothing submits jobs. The pinned upstream image
  installs no iproute-tc, so `tc` is probably absent (the inject now fails
  loudly if so; not checked in a built image). Unblocking needs a dedicated
  fabric network, at least two workers, netem on the fabric interface only, an
  image overlay that installs iproute-tc, and a workload that runs one
  single-node and one multi-node job. A run is not an unblocking condition: as
  for every runnable scenario, it is what would later mark the chain measured.
reported_node: gpu.device
canary: 4eafe8c8-4be8-4fed-a35d-6b561118d18d

symptom: >-
  Multi-node training jobs are taking three to four times longer than last week.
  Single-node jobs are unaffected. No job fails. GPU utilisation on the affected
  jobs is low and spiky. Nobody changed the model code.

notes: >-
  The classic fabric problem, and the one most often misdiagnosed as a GPU or
  application issue because the visible symptom is low GPU utilisation. The
  discriminator is the single-node/multi-node split: a slow GPU is slow
  everywhere, while a degraded fabric only hurts jobs that talk across nodes.
  Blocked; kept so the design and the reason are visible.

injection: >-
  tc netem (40ms ± 10ms delay, 3% loss) on the worker's eth0. As shipped this is
  the control-plane network, not a data-plane fabric, which is why the scenario
  is blocked. Since 2026-09 the inject fails loudly without tc, records the
  interface's qdiscs first, and refuses to run over a root qdisc the heal could
  not restore; the heal only removes a netem root qdisc it recorded adding. It
  cannot reproduce per-QP or per-HCA counter signatures. Not yet run on the
  emulated cluster.

observe_s: 240

verification:
  measured: false
  caveats: >-
    Chain is designed, not observed, and blocked (see blocked_reason). Its
    timings must not be quoted.

causal_chain:
  - node: fabric.interconnect
    state: degraded_retransmits
    observable_at_s: 0
    evidence:
      - "IB/RoCE port counters: retransmit and out-of-sequence errors climbing (no source for these exists in the emulated cluster)"
      - "only jobs spanning more than one node are affected"
      - "GPU utilisation low and spiky on affected ranks — waiting, not computing"

scoring:
  - node: fabric.interconnect
    credit: 1.0
    rationale: The fabric is degraded and the port counters name it directly.
  - node: gpu.device
    credit: 0.0
    rationale: >-
      The most common wrong answer, and zero because the evidence positively
      excludes it: the same GPUs run single-node jobs at full speed.
  - node: network.control_plane
    credit: 0.35
    rationale: >-
      Right layer, wrong network. Control-plane and data-plane fabrics are
      distinct, but an agent naming "the network" has localised the fault
      correctly and would escalate to the right team.
  - node: unknown
    credit: 0.05
    rationale: The single-node/multi-node split is a clear discriminator.

remediation_helpful:
  - "repair:fabric.interconnect"
  - "drain:slurm.slurmd"

distractors:
  gpu.device: >-
    Low GPU utilisation on a slow training job invites blaming the GPUs. They
    are idle because they are waiting on the network.
  slurm.config: >-
    "Topology must be misconfigured" is plausible if the agent knows about
    topology.conf, but nothing about placement changed.
