id: S08-partition-limit-starvation
title: One account's jobs never start while the cluster sits half idle
family: scheduler_config
difficulty: single_layer
status: blocked
blocked_reason: >-
  Measured not to work: the cluster runs with AccountingStorageEnforce unset
  (scontrol show config reports none), so association limits are recorded and
  never enforced, and job 6 was submitted normally with the limit in place.
  Unblocking needs AccountingStorageEnforce=limits through a slurm.conf overlay
  and a workload that submits under the limited account and another account.
  With those in place, that measurement no longer applies; as for every
  runnable scenario, a new run is what would mark the chain measured.
reported_node: slurm.scheduler
canary: e41b9162-d5b4-45cc-beb3-6bc1e4ceb578

symptom: >-
  Jobs from one account have been PENDING for hours. sinfo shows plenty of idle
  nodes. Other accounts are running normally. squeue shows a limit-related
  Reason for the stuck jobs.

notes: >-
  A configuration fault with the answer written in the Reason field, included as
  a control for the opposite failure mode: an agent that always reaches for
  infrastructure causes will overshoot straight past it. If a configuration with
  the dependency graph scores *worse* here than one without, that is evidence
  the graph is being over-applied, which is a finding worth having.

  The ticket used to quote "Reason=QOSMaxJobs" and "AssocMaxJobs". Slurm has no
  reason codes with those names; the ones that exist include AssocGrpJobsLimit,
  AssocMaxJobsLimit and QOSMaxJobsPerUserLimit
  (https://slurm.schedmd.com/job_reason_codes.html). With a GrpJobs limit on the
  account, the expected reason is AssocGrpJobsLimit; that has not been observed.

injection: >-
  sacctmgr creates a benchmark-owned account (rcas08), associates root with it,
  and sets GrpJobs=0 on it. The first version set GrpJobs=0 on the `root`
  account, the parent of every account, which contradicts "other accounts are
  running normally". The heal clears the limit and deletes only that account,
  and both scripts refuse any account name outside rca*. Not yet run on the
  emulated cluster.

observe_s: 120

verification:
  measured: false
  method: >-
    Injection attempted against the benchmark cluster; the *negative* result
    below is measured even though the causal chain is not.
  observations:
    "inject": "sacctmgr GrpJobs=0 applied, then sbatch succeeded — job 6 submitted normally"
    "config": "scontrol show config reports AccountingStorageEnforce = none"
  caveats: >-
    BLOCKED, and measured to be blocked. The upstream cluster ships
    AccountingStorageEnforce unset, so association limits are recorded but never
    enforced and this injection has no effect. The scenario needs
    AccountingStorageEnforce=limits in slurm.conf, which is a cluster-config
    change to the benchmark image rather than a scenario change.

    Recorded here rather than quietly dropped: a benchmark that ships a scenario
    whose injection silently does nothing would score every agent on a fault
    that never happened, and they would all appear to fail at diagnosing it.
    It is excluded from scoring and from every published denominator.

causal_chain:
  - node: slurm.config
    state: association_limit_reached
    observable_at_s: 0
    evidence:
      - "squeue Reason field names the limit (AssocGrpJobsLimit expected for a GrpJobs limit; unobserved)"
      - "sacctmgr show assoc reveals the restrictive GrpJobs value"
      - "nodes are idle and other accounts schedule normally"

scoring:
  - node: slurm.config
    credit: 1.0
    rationale: >-
      A limit is doing exactly what it was configured to do. The scheduler is
      healthy; the policy is the cause.
  - node: slurm.scheduler
    credit: 0.15
    rationale: >-
      The scheduling loop is where the effect appears, and an agent that
      inspects it has looked in a sensible place, but nothing there is faulty.
  - node: slurm.slurmctld
    credit: 0.05
    rationale: Naming the controller is naming the host of the policy, not the policy.
  - node: storage.shared_fs
    credit: 0.0
    rationale: >-
      Zero, and pointedly: this is the overshoot answer for an agent that has
      learned "PENDING jobs mean something is broken upstream".
  - node: unknown
    credit: 0.05
    rationale: squeue states the reason in plain text; abstention is not defensible.

remediation_helpful:
  - "repair:slurm.config"
  - "investigate:slurm.config"

distractors:
  storage.shared_fs: >-
    An agent may have learned that idle nodes plus pending jobs means a backend
    fault. Here the Reason field says otherwise.
  slurm.slurmctld: >-
    "The scheduler is stuck" is the natural reading of a long PENDING queue.
