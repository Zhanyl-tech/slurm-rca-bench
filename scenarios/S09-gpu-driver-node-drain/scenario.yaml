id: S09-gpu-driver-node-drain
title: A node drains itself repeatedly and comes back each time
family: gpu
difficulty: multi_layer
status: blocked
blocked_reason: >-
  Hops two and three need a node health check, and the pinned upstream
  slurm.conf has `#HealthCheckProgram=` and `#HealthCheckInterval=0` commented
  out, so nothing ever calls the synthetic nvidia-smi and the node never drains.
  There is also no GPU node (one CPU worker, no Gres) and no workload, so no job
  fails with CUDA errors. Unblocking needs a slurm.conf overlay that sets
  HealthCheckProgram to a script calling nvidia-smi, and a workload generator.
  A run is not an unblocking condition: as for every runnable scenario, it is
  what would later mark the chain measured.
reported_node: slurm.slurmd
canary: 2f9c4756-e7cd-4e22-bdb3-1e587e423c98

symptom: >-
  One node has drained itself four times in the last two hours, each time with
  Reason set by the health check, and each time an operator resumed it and it
  drained again within twenty minutes. Jobs on it fail with CUDA initialisation
  errors.

notes: >-
  Multi-layer within a single node: the driver wedges, NVML stops answering, the
  health check sees no GPUs and drains, an operator resumes, and the loop
  repeats. The trap is that every individual observation points at the GPU
  hardware, while the hardware is fine and a driver reset fixes it.

  Distinguishing this from S04 is the point of having both. S04 has per-device
  ECC counters implicating one card; here NVML fails wholesale for every device,
  which is a driver-level signature, not a hardware one. Blocked; kept so the
  design and the reason are visible.

injection: >-
  A synthetic nvidia-smi that fails for every device with a driver-communication
  error. As shipped, nothing calls it (see blocked_reason). Since 2026-09 the
  install refuses to overwrite an nvidia-smi it did not write and the heal
  deletes only its own file. The cluster has no real GPUs, so this signature is
  synthetic by construction. Not yet run on the emulated cluster.

observe_s: 300

verification:
  measured: false
  caveats: Chain designed, not observed, and blocked (see blocked_reason).

causal_chain:
  - node: gpu.driver
    state: nvml_unresponsive
    observable_at_s: 0
    evidence:
      - "nvidia-smi fails for ALL devices, not one — wholesale, not per-card"
      - "no ECC or thermal counters are readable at all, rather than reading as bad"
      - "dmesg shows driver-level messages, not per-device XIDs (not emulated)"

  - node: slurm.slurmd
    state: health_check_failing
    observable_at_s: 60
    evidence:
      - "the node health check exits non-zero and the node drains"
      - "drain Reason is set by the health check, not by an operator"

  - node: slurm.slurmctld
    state: node_drained_repeatedly
    observable_at_s: 120
    evidence:
      - "sinfo shows the node DRAINED; scontrol shows a repeating drain/resume history"
      - "only this node is affected; the rest of the partition is healthy"

scoring:
  - node: gpu.driver
    credit: 1.0
    rationale: >-
      The driver is wedged. Every device failing at once is the discriminator:
      hardware faults are per-device, driver faults are wholesale.
  - node: gpu.device
    credit: 0.4
    rationale: >-
      Right node, right subsystem, wrong layer — and the action differs, since
      a driver reset restores the node while an RMA does not. Substantial
      partial credit because it still drains the right node.
  - node: slurm.slurmd
    credit: 0.15
    rationale: >-
      The health check is doing its job correctly. Naming it identifies the
      mechanism that surfaces the fault, not the fault.
  - node: slurm.config
    credit: 0.0
    rationale: >-
      "The health check must be misconfigured" is a real temptation when a node
      drains repeatedly. The health check is right; the driver is wrong.
  - node: unknown
    credit: 0.05
    rationale: The wholesale-versus-per-device signature is available and decisive.

remediation_helpful:
  - "reset:gpu.driver"
  - "drain:slurm.slurmd"

distractors:
  gpu.device: >-
    Everything about the presentation says "bad GPU", and on most clusters it
    usually is. The tell is that all devices fail together.
  slurm.config: >-
    Repeated automatic drains invite blaming the health-check configuration.
