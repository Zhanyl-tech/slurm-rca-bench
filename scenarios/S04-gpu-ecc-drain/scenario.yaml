id: S04-gpu-ecc-drain
title: One node keeps failing jobs, others are fine
family: gpu
difficulty: single_layer
status: runnable
reported_node: slurm.slurmd
canary: 561eea3d-b131-4254-a509-c2ca25821b38

symptom: >-
  Jobs assigned to one GPU node fail within minutes with CUDA errors. The same
  jobs succeed when they land elsewhere. The node shows as IDLE between failures.

notes: >-
  A single-node hardware fault, deliberately easy to *localise* and harder to
  *name*: an agent must distinguish uncorrectable ECC since boot (the card is
  failing now) from lifetime counters (historic, already handled). Getting the
  node right but the mechanism wrong is scored as partial credit, because in
  practice that still leads to the correct action of draining the node.

injection: >-
  The worker's nvidia-smi is replaced with a script that prints a synthetic
  volatile uncorrectable ECC count and a row-remap failure, whatever arguments
  it is given. That text is the only evidence this scenario produces. The
  cluster has one CPU worker, no GPU node, no Gres and no workload, so the
  failing jobs and the "elsewhere" in the ticket are not reproduced; an agent
  that looks for them in sacct finds nothing. Since 2026-09 the install refuses
  to overwrite an nvidia-smi it did not write and the heal deletes only its own
  file. Not yet run on the emulated cluster.

observe_s: 180

verification:
  measured: false
  caveats: >-
    Design only; never run. The synthetic output approximates `nvidia-smi -q -d
    ECC` and has not been compared with a real device's output. Reproducing the
    ticket itself needs a second worker and a workload generator.

causal_chain:
  - node: gpu.device
    state: uncorrectable_ecc_volatile
    observable_at_s: 0
    evidence:
      - "nvidia-smi on the worker: volatile uncorrectable ECC errors non-zero on one device"
      - "nvidia-smi on the worker: row remapping failure on the same device"

scoring:
  - node: gpu.device
    credit: 1.0
    rationale: The card is failing and the counters say so unambiguously.
  - node: gpu.driver
    credit: 0.35
    rationale: >-
      Wrong mechanism, right locality. A driver-level answer still drains the
      node, which is the correct action, so it earns real partial credit.
  - node: slurm.slurmd
    credit: 0.1
    rationale: >-
      Identifies the affected node but blames the wrong layer entirely; slurmd
      is reporting the failure, not causing it.
  - node: unknown
    credit: 0.05
    rationale: Solvable from a single command's output; abstention earns little.

distractors:
  slurm.config: >-
    "The partition must be misconfigured" is tempting because the failures look
    placement-dependent. They are — but because of the hardware on that node.
  fabric.interconnect: >-
    Single-node CUDA failures are not a fabric problem, but multi-node job
    failures are often blamed on the fabric out of habit.
