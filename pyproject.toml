[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slurmrca"
version = "0.1.0"
description = "The first public incident-diagnosis benchmark for HPC schedulers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zhanyl Abdybaeva" }]
keywords = ["slurm", "hpc", "benchmark", "root-cause-analysis", "llm-agents", "sre"]
dependencies = ["pyyaml>=6.0", "click>=8.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.8", "ruff>=0.5", "types-PyYAML"]

[project.scripts]
slurm-rca = "slurmrca.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/slurmrca"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PTH", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
# No python_version pin: the CI matrix runs each interpreter it claims to
# support, and mypy should check against the one it is running under.
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
