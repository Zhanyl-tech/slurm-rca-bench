name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: nothing in CI writes to the repository.
permissions:
  contents: read

# Actions are pinned by full commit SHA (tag in the comment), so a moved tag
# cannot change what runs here.
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # Every script the harness sends into a container. None of them can be
      # run against a cluster in this job, so lint is the first line of defence.
      - run: shellcheck --shell=sh src/slurmrca/scripts/*.sh cluster/build-image.sh
      - run: for f in src/slurmrca/scripts/*.sh cluster/build-image.sh; do sh -n "$f"; done
      # The gate matches `make test`; see COV_MIN in the Makefile.
      - run: pytest -q --cov --cov-report=term --cov-fail-under=90
      # The benchmark's credibility is its ground truth. Check it on every push.
      - run: slurm-rca validate

  # The first wheel shipped no scenarios, and CI only ever used an editable
  # install, so nothing noticed. Build it, install it somewhere clean, and run
  # it away from the source tree.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --wheel --outdir dist
      - run: python -m venv /tmp/wheel-venv
      - run: /tmp/wheel-venv/bin/pip install dist/*.whl
      - name: run from outside the checkout
        working-directory: /tmp
        run: |
          /tmp/wheel-venv/bin/slurm-rca validate
          /tmp/wheel-venv/bin/slurm-rca list
          /tmp/wheel-venv/bin/slurm-rca baselines
          /tmp/wheel-venv/bin/slurm-rca export > /dev/null
